<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>字段捷径上架效果模拟 · 快递查询助手</title>
  <style>
    :root {
      color-scheme: light;
      --page: #fff;
      --panel: #f5f6f7;
      --panel-2: #f8f9fb;
      --border: #d9dfe8;
      --text: #1f2329;
      --muted: #646a73;
      --blue: #3370ff;
      --blue-soft: #eaf2ff;
      --saved-text: #087f5b;
      --saved-fill: #e8f6ef;
      --saved-border: #bbe6d0;
      --shadow: 0 8px 26px rgb(31 35 41 / 12%);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #191b20;
      --panel: #242832;
      --panel-2: #20242d;
      --border: #454d5c;
      --text: #e5e6eb;
      --muted: #a9b1c0;
      --blue: #7aa2ff;
      --blue-soft: #253858;
      --saved-text: #80d9b3;
      --saved-fill: #1b372e;
      --saved-border: #345b4c;
      --shadow: 0 8px 26px rgb(0 0 0 / 28%);
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .demo-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
    }
    .demo-tag { color: var(--blue); font-weight: 650; }
    .theme-button {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--page);
      color: var(--text);
      font-size: 12px;
    }
    .dialog {
      width: min(100%, 510px);
      min-height: calc(100vh - 39px);
      margin: 0 auto;
      padding: 15px 16px 12px;
      background: var(--page);
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 15px; font-weight: 500; }
    h2 { margin-bottom: 7px; font-size: 13px; font-weight: 400; color: var(--muted); }
    .title-input {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--page);
      color: var(--text);
    }
    .section { margin-top: 17px; }
    .type-list { overflow: hidden; border-radius: 7px; background: var(--panel); }
    .type-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 39px;
      padding: 0 11px;
      color: var(--text);
    }
    .type-row.active { background: #dbe7ff; color: #164ec0; }
    :root[data-theme="dark"] .type-row.active { background: #263b68; color: #c5d7ff; }
    .type-row small { margin-left: 5px; padding: 2px 5px; border-radius: 4px; background: var(--blue-soft); color: var(--blue); font-size: 11px; }
    .chevron { color: var(--muted); font-size: 18px; line-height: 1; }
    .config-box, .range-box, .outputs-box {
      padding: 9px 10px;
      border-radius: 7px;
      background: var(--panel);
    }
    .config-box { display: grid; gap: 13px; }
    .config-item { display: grid; gap: 5px; }
    .config-label { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
    .info { display: inline-grid; place-items: center; width: 14px; height: 14px; border: 1px solid currentColor; border-radius: 50%; font-size: 10px; }
    .select-mock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 34px;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--page);
      color: var(--text);
    }
    .select-mock[aria-expanded="true"] { border-color: var(--blue); box-shadow: 0 0 0 2px rgb(51 112 255 / 12%); }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 12px;
    }
    .chip button { padding: 0; border: 0; background: none; color: inherit; cursor: pointer; }
    .field-menu {
      display: grid;
      gap: 2px;
      margin-top: -8px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--page);
      box-shadow: var(--shadow);
    }
    .field-option {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px;
      border-radius: 5px;
      color: var(--text);
      cursor: pointer;
    }
    .field-option:hover { background: var(--panel); }
    .field-option input { accent-color: var(--blue); }
    .range-box { display: grid; gap: 10px; }
    .radio-row { display: flex; align-items: center; gap: 7px; }
    .radio-row input { accent-color: var(--blue); }
    .number-input {
      width: 100%;
      height: 34px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--page);
      color: var(--text);
    }
    .number-wrap { display: grid; grid-template-columns: 1fr 38px; align-items: center; gap: 0; }
    .number-wrap .number-input { border-radius: 7px 0 0 7px; }
    .stepper {
      display: grid;
      grid-template-rows: 1fr 1fr;
      height: 34px;
      border: 1px solid var(--border);
      border-left: 0;
      border-radius: 0 7px 7px 0;
      overflow: hidden;
    }
    .stepper button { padding: 0; border: 0; background: var(--page); color: var(--muted); font-size: 11px; }
    .stepper button + button { border-top: 1px solid var(--border); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch {
      position: relative;
      display: inline-flex;
      width: 34px;
      height: 20px;
      flex: none;
    }
    .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
    .switch span { width: 34px; height: 20px; padding: 3px; border-radius: 20px; background: #aeb7c4; transition: .15s; pointer-events: none; }
    .switch span::before { content: ""; display: block; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: .15s; }
    .switch input:checked + span { background: var(--blue); }
    .switch input:checked + span::before { transform: translateX(14px); }
    .more-toggle { display: flex; align-items: center; gap: 8px; color: var(--text); }
    .output-list { display: grid; gap: 12px; padding: 4px 2px; }
    .output-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .output-name { display: flex; align-items: center; gap: 9px; }
    .output-icon { color: var(--muted); font-size: 17px; }
    .check { width: 16px; height: 16px; accent-color: var(--blue); }
    .schedule {
      display: grid;
      gap: 10px;
      margin-top: 9px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel-2);
    }
    .schedule-title { font-size: 12px; color: var(--blue); }
    .plan-toggle { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px; }
    .plan-toggle:has(input:checked) { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
    .plan-toggle input { accent-color: var(--blue); }
    .schedule-row { display: grid; grid-template-columns: minmax(0, 1fr); }
    .schedule-row > * { min-width: 0; }
    .schedule-control-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 4px; }
    .schedule-control-row > * { min-width: 0; }
    .time-input, .interval-input, .unit-select {
      height: 34px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--page);
      color: var(--text);
    }
    .time-input { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .time-input[aria-expanded="true"] { border-color: var(--blue); }
    .time-chevron { flex: none; width: 12px; height: 12px; color: var(--muted); }
    .time-input[aria-expanded="true"] .time-chevron { transform: rotate(180deg); }
    .time-picker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px; padding: 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--page); }
    .time-picker label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
    .time-picker select { width: 100%; min-width: 0; padding: 3px; border: 1px solid var(--border); border-radius: 5px; color: var(--text); background: var(--panel-2); }
    .time-picker option { padding: 4px 7px; }
    .time-picker option:checked { background: var(--blue-soft) linear-gradient(var(--blue-soft), var(--blue-soft)); color: var(--text); }
    .interval-group { display: grid; grid-template-columns: minmax(0, 1fr) 70px; gap: 6px; }
    .schedule-button, .footer button {
      min-height: 34px;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--page);
      color: var(--text);
    }
    .schedule-button { color: var(--blue); white-space: nowrap; }
    .schedule-button:disabled { color: var(--muted); cursor: default; }
    .schedule-button.is-saved { border-color: var(--saved-border); background: var(--saved-fill); color: var(--saved-text); }
    .field-placeholder { color: var(--muted); }
    .interval-hint { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .schedule-status { color: var(--muted); font-size: 12px; }
    .feedback { margin-top: 8px; color: var(--muted); text-align: right; font-size: 12px; }
    .switch input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 3px; }
    .footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 17px; }
    .footer .primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    :root[data-theme="dark"] .footer .primary { color: #172343; }
    @media (max-width: 380px) {
      .dialog { padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <div class="demo-bar">
    <span><span class="demo-tag">字段捷径上架效果模拟</span> · 模拟飞书配置弹窗，不是正式发布页面</span>
    <button class="theme-button" id="theme" type="button">切换深色</button>
  </div>
  <main class="dialog">
    <section>
      <h1>标题</h1>
      <input class="title-input" value="快递查询助手" aria-label="字段捷径标题">
    </section>

    <section class="section">
      <h2>字段类型</h2>
      <div class="type-list">
        <div class="type-row"><span>▣ 对象 <span class="info">i</span></span><span class="chevron">›</span></div>
        <div class="type-row active"><span>◉ 快递查询 <small>字段捷径</small></span><span class="chevron">›</span></div>
      </div>
    </section>

    <section class="section">
      <h2>配置</h2>
      <div class="config-box">
        <div class="config-item">
          <div class="config-label">⌄ 快递单号 <span class="info">i</span></div>
          <select class="select-mock" aria-label="快递单号"><option>快递单号</option><option>运单编号</option></select>
        </div>
        <div class="config-item">
          <div class="config-label">⌄ 核验手机号 <span class="info">i</span></div>
          <select class="select-mock" aria-label="核验手机号"><option>核验手机号</option><option>收件手机号</option><option>不选择</option></select>
        </div>
        <div class="config-item">
          <div class="config-label">⌄ 按时更新字段（多选） <span class="info">i</span></div>
          <button class="select-mock" id="field-trigger" type="button" aria-expanded="false">
            <span class="chips" id="selected-fields"></span><span class="chevron">⌄</span>
          </button>
          <div class="field-menu" id="field-menu" hidden>
            <label class="field-option"><input type="checkbox" value="快递单号" checked>快递单号</label>
            <label class="field-option"><input type="checkbox" value="核验手机号" checked>核验手机号</label>
            <label class="field-option"><input type="checkbox" value="定时刷新时间">定时刷新时间（日期时间）</label>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>生成范围</h2>
      <div class="range-box">
        <label class="radio-row"><input name="range" type="radio" id="whole-column">整列</label>
        <label class="radio-row"><input name="range" type="radio" id="custom-range" checked>自定义行数</label>
        <div class="number-wrap">
          <input class="number-input" id="range-count" type="number" min="1" step="1" value="5" aria-label="自定义行数">
          <span class="stepper"><button type="button" id="range-up" aria-label="增加行数">⌃</button><button type="button" id="range-down" aria-label="减少行数">⌄</button></span>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="row-between">
        <div class="more-toggle"><label class="switch"><input id="more" type="checkbox" role="switch" aria-label="获取更多信息" aria-controls="outputs" checked><span></span></label>获取更多信息 <span class="info" aria-hidden="true">i</span></div>
      </div>
      <div class="outputs-box" id="outputs">
        <div class="output-list">
          <label class="output-row"><span class="output-name"><span class="output-icon">A↕</span>物流摘要</span><input class="check" type="checkbox" checked></label>
          <label class="output-row"><span class="output-name"><span class="output-icon">A↕</span>快递单号</span><input class="check" type="checkbox" checked></label>
          <label class="output-row"><span class="output-name"><span class="output-icon">A↕</span>快递公司</span><input class="check" type="checkbox" checked></label>
          <label class="output-row"><span class="output-name"><span class="output-icon">A↕</span>快递公司编码</span><input class="check" type="checkbox" checked></label>
          <label class="output-row"><span class="output-name"><span class="output-icon">A↕</span>物流状态</span><input class="check" type="checkbox" checked></label>
          <label class="output-row"><span class="output-name"><span class="output-icon">A↕</span>最新轨迹</span><input class="check" type="checkbox" checked></label>
          <label class="output-row"><span class="output-name"><span class="output-icon">▧</span>查询时间</span><input class="check" type="checkbox" checked></label>
          <label class="output-row"><span class="output-name"><span class="output-icon">A↕</span>完整轨迹</span><input class="check" type="checkbox" checked></label>
          <label class="output-row"><span class="output-name"><span class="output-icon">A↕</span>同步日志</span><input class="check" type="checkbox" checked></label>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="row-between">
        <div class="more-toggle"><label class="switch"><input id="auto" type="checkbox" role="switch" aria-label="自动更新" aria-controls="schedule" checked><span></span></label>自动更新 <span class="info" aria-hidden="true">i</span></div>
      </div>
      <div class="schedule" id="schedule">
        <div class="schedule-title">按时更新（可选）</div>
        <label class="plan-toggle"><input type="checkbox" id="daily-on" aria-controls="daily-settings">每日定时</label>
        <div id="daily-settings" hidden>
          <div class="schedule-row">
            <div class="schedule-status" id="time-label">每日查询时间（北京时间）</div>
            <div class="schedule-control-row">
              <button class="time-input" id="daily-time" type="button" aria-labelledby="time-label time-value" aria-expanded="false" aria-controls="time-picker"><span id="time-value">08:00</span><svg class="time-chevron" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <button class="schedule-button" type="button" id="apply-time">保存时间</button>
            </div>
          </div>
          <div class="time-picker" id="time-picker" hidden>
            <label>小时<select size="5" id="hours"></select></label>
            <label>分钟<select size="5" id="minutes"></select></label>
          </div>
        </div>
        <label class="plan-toggle"><input type="checkbox" id="interval-on" aria-controls="interval-settings">按间隔</label>
        <div id="interval-settings" hidden>
          <div class="schedule-row">
            <label class="schedule-status" for="interval">查询间隔</label>
            <div class="schedule-control-row">
              <span class="interval-group"><input class="interval-input" id="interval" type="number" min="0.5" step="0.5" max="720" value="8"><select class="unit-select" id="unit" aria-label="查询间隔单位"><option value="60">小时</option><option value="1">分钟</option></select></span>
              <button class="schedule-button" type="button" id="apply-interval">保存间隔</button>
            </div>
          </div>
          <p class="interval-hint" id="interval-hint" role="status" hidden>请按 30 分钟的倍数设置，范围为 30 分钟至 720 小时。</p>
        </div>
      </div>
    </section>

    <div class="footer"><button type="button" id="cancel">取消</button><button class="primary" type="button" id="confirm">确定</button></div>
    <p class="feedback" id="feedback" role="status">仅模拟配置，不会发起查询或扣额度。</p>
  </main>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const auto = $('auto');
    const schedule = $('schedule');
    const time = $('daily-time');
    const dailyOn = $('daily-on');
    const intervalOn = $('interval-on');
    const picker = $('time-picker');
    const hours = $('hours');
    const minutes = $('minutes');
    const interval = $('interval');
    const unit = $('unit');
    const saveTime = $('apply-time');
    const saveInterval = $('apply-interval');
    const trigger = $('field-trigger');
    const menu = $('field-menu');
    const selected = $('selected-fields');
    const theme = $('theme');
    const media = matchMedia('(prefers-color-scheme: dark)');
    let manualTheme = false;

    function setTheme(dark) {
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      theme.textContent = dark ? '切换浅色' : '切换深色';
    }
    setTheme(media.matches);
    media.addEventListener('change', event => { if (!manualTheme) setTheme(event.matches); });
    theme.addEventListener('click', () => { manualTheme = true; setTheme(document.documentElement.dataset.theme !== 'dark'); });

    function selectedFields() {
      return [...menu.querySelectorAll('input:checked')].map(input => input.value);
    }
    function renderFields() {
      selected.innerHTML = selectedFields().map(value => `<span class="chip">${value}</span>`).join('') || '<span class="field-placeholder">请选择字段</span>';
    }
    const pad = value => String(value).padStart(2, '0');
    const dailyTime = () => `${pad(hours.value)}:${pad(minutes.value)}`;
    const intervalMinutes = () => interval.valueAsNumber * Number(unit.value);
    const validInterval = () => interval.validity.valid && Number.isFinite(intervalMinutes()) && intervalMinutes() % 30 === 0;
    const storageKey = 'field-published-simulation.schedule.v1';
    const minuteMs = 60_000;
    const dayMs = 24 * 60 * minuteMs;
    const beijingOffset = 8 * 60 * minuteMs;
    function loadSchedule() {
      try { return JSON.parse(localStorage.getItem(storageKey)) || {}; }
      catch { return {}; }
    }
    const stored = loadSchedule();
    let savedDaily = typeof stored.daily === 'string' && /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(stored.daily) ? stored.daily : null;
    let savedInterval = Number.isInteger(stored.interval) && stored.interval >= 30 && stored.interval <= 43200
      && stored.interval % 30 === 0 ? stored.interval : null;
    let dailyDue = savedDaily ? nextDaily(savedDaily, Date.now()) : Infinity;
    let intervalDue = savedInterval
      ? Number.isFinite(stored.intervalDue) && stored.intervalDue > Date.now() ? stored.intervalDue : Date.now() + savedInterval * minuteMs
      : Infinity;
    let timer;
    let activeUnit = Number(unit.value);
    const [initialHour, initialMinute] = (savedDaily || '08:00').split(':').map(Number);
    dailyOn.checked = savedDaily !== null;
    intervalOn.checked = savedInterval !== null;
    if (savedInterval !== null) interval.value = savedInterval / activeUnit;
    for (const [select, count, initial] of [[hours, 24, initialHour], [minutes, 60, initialMinute]]) {
      for (let index = 0; index < count; index++) select.add(new Option(pad(index), index));
      select.value = initial;
      select.addEventListener('change', renderSchedule);
    }
    function nextDaily(value, now) {
      const [hour, minute] = value.split(':').map(Number);
      const midnight = Math.floor((now + beijingOffset) / dayMs) * dayMs - beijingOffset;
      const today = midnight + (hour * 60 + minute) * minuteMs;
      return today > now ? today : today + dayMs;
    }
    function storeSchedule() {
      try {
        localStorage.setItem(storageKey, JSON.stringify({ daily: savedDaily, interval: savedInterval, intervalDue }));
      } catch { /* The current preview session still works without storage. */ }
    }
    function runSchedule() {
      clearTimeout(timer);
      const now = Date.now();
      const didRun = dailyDue <= now || intervalDue <= now;
      if (dailyDue <= now) {
        dailyDue = nextDaily(savedDaily, now);
      }
      if (intervalDue <= now) {
        const period = savedInterval * minuteMs;
        intervalDue += (Math.floor((now - intervalDue) / period) + 1) * period;
        storeSchedule();
      }
      if (didRun) schedule.dataset.lastSimulatedRun = new Date(now).toISOString();
      const due = Math.min(dailyDue, intervalDue);
      if (Number.isFinite(due)) timer = setTimeout(runSchedule, Math.min(due - now, minuteMs));
    }
    function applySchedule(daily, minutesBetween) {
      if (daily !== savedDaily) dailyDue = daily ? nextDaily(daily, Date.now()) : Infinity;
      if (minutesBetween !== savedInterval) intervalDue = minutesBetween ? Date.now() + minutesBetween * minuteMs : Infinity;
      savedDaily = daily;
      savedInterval = minutesBetween;
      storeSchedule();
      renderSchedule();
      runSchedule();
    }
    function showPicker(open, restoreFocus = false) {
      picker.hidden = !open;
      time.setAttribute('aria-expanded', String(open));
      if (open) {
        for (const list of [hours, minutes]) {
          const option = list.selectedOptions[0].getBoundingClientRect();
          const box = list.getBoundingClientRect();
          if (option.top < box.top || option.bottom > box.bottom) {
            list.scrollTop += option.top - box.top - (list.clientHeight - option.height) / 2;
          }
        }
      } else if (restoreFocus) time.focus({ preventScroll: true });
    }
    function renderSchedule() {
      schedule.hidden = !auto.checked;
      $('daily-settings').hidden = !dailyOn.checked;
      $('interval-settings').hidden = !intervalOn.checked;
      if (!auto.checked || !dailyOn.checked) showPicker(false);
      $('time-value').textContent = dailyTime();
      const dailySaved = dailyTime() === savedDaily;
      const intervalValid = validInterval();
      const intervalSaved = intervalMinutes() === savedInterval;
      saveTime.disabled = dailySaved;
      saveTime.classList.toggle('is-saved', dailySaved);
      saveTime.textContent = dailySaved ? '保存成功' : '保存时间';
      saveInterval.disabled = !intervalValid || intervalSaved;
      saveInterval.classList.toggle('is-saved', intervalSaved);
      saveInterval.textContent = intervalSaved ? '保存成功' : '保存间隔';
      const showIntervalHint = auto.checked && intervalOn.checked && !intervalValid;
      interval.setAttribute('aria-invalid', String(showIntervalHint));
      $('interval-hint').hidden = !showIntervalHint;
      if (showIntervalHint) interval.setAttribute('aria-describedby', 'interval-hint');
      else interval.removeAttribute('aria-describedby');
      $('feedback').textContent = '仅模拟配置，不会发起查询或扣额度。';
    }
    trigger.addEventListener('click', () => {
      menu.hidden = !menu.hidden;
      trigger.setAttribute('aria-expanded', String(!menu.hidden));
    });
    menu.addEventListener('change', renderFields);
    document.addEventListener('click', event => {
      if (!trigger.contains(event.target) && !menu.contains(event.target)) {
        menu.hidden = true;
        trigger.setAttribute('aria-expanded', 'false');
      }
    });
    for (const input of [auto, dailyOn, intervalOn]) input.addEventListener('change', () => {
      applySchedule(auto.checked && dailyOn.checked ? savedDaily : null, auto.checked && intervalOn.checked ? savedInterval : null);
    });
    interval.addEventListener('input', renderSchedule);
    time.addEventListener('click', () => showPicker(picker.hidden));
    saveTime.addEventListener('click', () => {
      if (!auto.checked || !dailyOn.checked) return;
      applySchedule(dailyTime(), savedInterval);
    });
    saveInterval.addEventListener('click', () => {
      if (!auto.checked || !intervalOn.checked || !validInterval()) return;
      applySchedule(savedDaily, intervalMinutes());
      interval.focus({ preventScroll: true });
    });
    picker.addEventListener('keydown', event => {
      if (event.key === 'Escape') { event.preventDefault(); showPicker(false, true); }
    });
    unit.addEventListener('change', () => {
      const converted = interval.valueAsNumber * activeUnit / Number(unit.value);
      activeUnit = Number(unit.value);
      interval.min = activeUnit === 60 ? '0.5' : '30';
      interval.step = interval.min;
      interval.max = String(43200 / activeUnit);
      interval.value = Number.isFinite(converted) ? String(converted) : '';
      renderSchedule();
    });
    $('more').addEventListener('change', event => { $('outputs').hidden = !event.target.checked; });
    const count = $('range-count');
    document.querySelectorAll('[name="range"]').forEach(input => input.addEventListener('change', () => {
      for (const control of [count, $('range-up'), $('range-down')]) control.disabled = $('whole-column').checked;
    }));
    $('range-up').addEventListener('click', () => count.stepUp());
    $('range-down').addEventListener('click', () => count.stepDown());
    $('cancel').addEventListener('click', () => location.reload());
    $('confirm').addEventListener('click', () => {
      if (auto.checked && intervalOn.checked && !validInterval()) {
        interval.focus();
        return;
      }
      applySchedule(auto.checked && dailyOn.checked ? dailyTime() : null, auto.checked && intervalOn.checked ? intervalMinutes() : null);
      $('feedback').textContent = '已应用模拟配置，未保存到飞书。';
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) runSchedule(); });
    renderFields();
    renderSchedule();
    runSchedule();
  </script>
</body>
</html>
